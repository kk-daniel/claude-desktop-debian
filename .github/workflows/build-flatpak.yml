name: Build Flatpak (Reusable)

on:
  workflow_call:
    inputs:
      build_flags:
        description: 'Flags to pass to build.sh (e.g., "--build flatpak")'
        required: false
        type: string
        default: "--build flatpak"
      artifact_suffix:
        description: "Suffix for the artifact name"
        required: true
        type: string
      arch_label:
        description: 'Architecture label used in the artifact name ("amd64" or "arm64")'
        required: false
        type: string
        default: "amd64"
      runner:
        description: 'GitHub runner label (e.g., "ubuntu-latest", "ubuntu-22.04-arm")'
        required: false
        type: string
        default: "ubuntu-latest"
      release_tag:
        description: "Optional release tag (e.g., v1.3.2+claude1.1.799) to derive wrapper version"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # flatpak-builder pulls org.freedesktop.Sdk and
      # org.electronjs.Electron2.BaseApp from Flathub at build time.
      # The runner image ships flatpak but not flatpak-builder, and
      # the CI runs as a normal user so --user installs go to
      # ~/.local/share/flatpak (no sudo needed).
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub remote (user)
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Run build script
        run: |
          TAG_FLAG=""
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG_FLAG="--release-tag ${{ inputs.release_tag }}"
          fi
          ./build.sh ${{ inputs.build_flags }} $TAG_FLAG

      - name: Smoke test bundle
        # Validates the file is a real Flatpak single-file bundle and
        # checks the embedded metadata. `flatpak info --show-metadata
        # <bundle>` inspects without installing, so no user-session
        # dbus is needed on the headless runner.
        run: |
          bundle=$(find . -maxdepth 1 -name 'claude-desktop-*.flatpak' \
            -print -quit)
          if [[ -z "$bundle" ]]; then
            echo "::error::No .flatpak bundle found"
            exit 1
          fi
          echo "Bundle: $bundle"
          file "$bundle"
          flatpak info --show-metadata "$bundle"

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ inputs.arch_label }}-${{ inputs.artifact_suffix }}
          path: |
            claude-desktop-*.flatpak
          if-no-files-found: error
